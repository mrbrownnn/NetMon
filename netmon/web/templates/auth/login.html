<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập · NetMon</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/netmon.css') }}">
</head>
<body>
<div class="nm-login-wrap">
  <section class="nm-panel nm-login">
    <div class="nm-panel-head">NetMon</div>
    <div class="nm-panel-body">
      <p class="muted mb-3">Đăng nhập hệ thống</p>
      {%- set locked = locked_seconds | default(0) | int %}
      {%- if locked > 0 %}
      <div class="nm-form-errors" role="alert"><i class="bi bi-exclamation-triangle"></i>
        Tài khoản tạm khóa, thử lại sau
        <span id="lock-left" data-seconds="{{ locked }}">{% if locked >= 60 %}{{ locked // 60 }} phút {% endif %}{{ locked % 60 }} giây</span>.
      </div>
      {%- elif error %}
      <div class="nm-form-errors" role="alert"><i class="bi bi-exclamation-triangle"></i> {{ error }}</div>
      {%- endif %}
      <form method="post" action="{{ request.path if request is defined else '/login' }}{% if request is defined and request.query_string %}?{{ request.query_string.decode() }}{% endif %}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="nm-form-row">
          <label class="nm-form-label" for="username">Tên đăng nhập</label>
          <div class="nm-form-field"><input class="form-control" id="username" name="username" value="{{ username | default('') }}" autocomplete="username" required autofocus></div>
        </div>
        <div class="nm-form-row">
          <label class="nm-form-label" for="password">Mật khẩu</label>
          <div class="nm-form-field"><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
        </div>
        <div class="nm-form-actions">
          <button type="submit" class="btn btn-primary"{% if locked > 0 %} disabled{% endif %}>Đăng nhập</button>
        </div>
      </form>
    </div>
  </section>
</div>
{%- if locked > 0 %}
<script>
(function () {
  var el = document.getElementById('lock-left'), s = +el.getAttribute('data-seconds');
  var t = setInterval(function () {
    s -= 1;
    if (s <= 0) { clearInterval(t); location.reload(); return; }
    el.textContent = (s >= 60 ? Math.floor(s / 60) + ' phút ' : '') + (s % 60) + ' giây';
  }, 1000);
})();
</script>
{%- endif %}
</body>
</html>
